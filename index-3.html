<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Liquid Glass UI</title>
<style>
/* ============================================================
   LIQUID GLASS UI — Tiered Design System
   "Use tiers early, stop inventing new glass per screen"
   ============================================================ */

:root {
  /* Color Tokens */
  --bg-blush: #E8D4D1;
  --bg-lavender: #A9A8C3;
  --bg-slate: #77879C;
  --glass-white: rgba(255,255,255,0.24);
  --glass-border: rgba(255,255,255,0.55);
  --glass-edge-inner: rgba(255,255,255,0.38);
  --text-primary: #25232C;
  --text-secondary: #66616F;
  --accent-violet: #6742F5;
  --accent-cyan: #5DE2DC;
  --accent-pink: #F3A6C9;
  --accent-green: #48B982;
  --accent-teal: #0D9488;

  /* Glass Tiers */
  --glass-primary: rgba(255,255,255,.24);
  --glass-secondary: rgba(255,255,255,.18);
  --glass-floating: rgba(255,255,255,.12);

  /* Radius Tiers */
  --radius-panel: clamp(28px, 4vw, 48px);
  --radius-card: 28px;
  --radius-control: 999px;
  --radius-icon: 50%;

  /* Spacing */
  --space-page: clamp(16px, 4vw, 44px);
  --space-panel: clamp(20px, 3vw, 48px);
  --space-gap: clamp(12px, 2vw, 24px);

  /* Typography */
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-serif: Georgia, "Times New Roman", serif;
  --heading-weight: 650;
  --body-weight: 400;
  --heading-size: clamp(24px, 3vw, 42px);
  --body-size: clamp(14px, 1.2vw, 18px);

  /* Effects */
  --blur-primary: 24px;
  --blur-secondary: 16px;
  --blur-floating: 12px;
  --shadow-panel: 0 32px 80px rgba(42,35,70,.22);
  --shadow-control: 0 12px 26px rgba(50,40,90,.20);
  --shadow-soft: 0 4px 16px rgba(42,35,70,.08);
  --ease: cubic-bezier(.22,.61,.36,1);
  --duration-fast: .2s;
  --duration-normal: .35s;
  --duration-slow: .5s;
}

/* ---------- Reset ---------- */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-sans);
  font-weight:var(--body-weight);
  font-size:var(--body-size);
  color:var(--text-primary);
  min-height:100vh;
  min-height:100svh;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
a{color:inherit;text-decoration:none}
ul,ol{list-style:none}
img{max-width:100%;display:block}

/* ============================================================
   AMBIENT LIGHTING - Continuous, Route-Agnostic
   ============================================================ */
.ambient{
  position:fixed;
  inset:-15%;
  z-index:0;
  pointer-events:none;
}
.ambient .light{
  position:absolute;
  border-radius:50%;
  transition:transform 1.8s var(--ease), opacity 1.8s var(--ease);
  will-change:transform,opacity;
}
.ambient .warm{
  width:45vw;height:45vw;left:5%;top:8%;
  background:rgba(255,190,180,.55);
}
.ambient .violet{
  width:40vw;height:40vw;right:8%;top:30%;
  background:rgba(160,125,255,.42);
}
.ambient .cyan{
  width:38vw;height:38vw;left:55%;bottom:5%;
  background:rgba(80,225,225,.36);
}

/* ============================================================
   GLASS TIERS - Consistent Application Across All Screens
   ============================================================ */

/* Primary Glass - Main containers, main panels */
.glass-primary{
  position:relative;
  isolation:isolate;
  background:var(--glass-primary);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-panel);
  backdrop-filter:blur(var(--blur-primary)) saturate(1.35);
  -webkit-backdrop-filter:blur(var(--blur-primary)) saturate(1.35);
  box-shadow:var(--shadow-panel);
}
.glass-primary::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.34),transparent 42%,rgba(255,255,255,.06));
  border:1px solid rgba(255,255,255,.14);
}

/* Secondary Glass - Cards, smaller components */
.glass-secondary{
  position:relative;
  isolation:isolate;
  background:var(--glass-secondary);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-card);
  backdrop-filter:blur(var(--blur-secondary)) saturate(1.3);
  -webkit-backdrop-filter:blur(var(--blur-secondary)) saturate(1.3);
  box-shadow:var(--shadow-soft);
}
.glass-secondary::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.25),transparent 50%);
}

/* Floating Glass - Controls, badges, icons */
.glass-floating{
  position:relative;
  isolation:isolate;
  background:var(--glass-floating);
  border:1px solid var(--glass-border);
  backdrop-filter:blur(var(--blur-floating)) saturate(1.2);
  -webkit-backdrop-filter:blur(var(--blur-floating)) saturate(1.2);
}

/* ============================================================
   APP SHELL
   ============================================================ */
#app{
  position:relative;
  z-index:1;
  max-width:1200px;
  margin:0 auto;
  min-height:100vh;
  min-height:100svh;
  display:flex;
  flex-direction:column;
  padding:0 var(--space-page) 40px;
}
.screen{
  display:none;
  flex:1;
  flex-direction:column;
  animation:pageEnter .5s var(--ease);
}
.screen.active{display:flex}

@keyframes pageEnter{
  from{opacity:0;transform:scale(.97) translateY(12px)}
  to{opacity:1;transform:none}
}
@keyframes pageExit{
  from{opacity:1;transform:scale(1)}
  to{opacity:0;transform:scale(.985)}
}

/* ============================================================
   UI COMPONENTS - Using Tiered Glass
   ============================================================ */

/* Top Bar */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:20px 0 16px;gap:16px;
}
.topbar .title{
  font-family:var(--font-serif);
  font-size:1.25rem;font-weight:700;color:var(--text-primary);
  letter-spacing:.02em;flex:1;text-align:center;
}
.topbar .title small{
  display:block;font-family:var(--font-sans);
  font-size:.65rem;color:var(--text-secondary);font-weight:400;
  letter-spacing:.14em;text-transform:uppercase;margin-top:2px;
}

/* Icon Button - Floating tier */
.icon-btn{
  width:40px;height:40px;border-radius:var(--radius-icon);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-primary);font-size:1.1rem;
  background:var(--glass-white);border:1px solid var(--glass-border);
  backdrop-filter:blur(var(--blur-floating));
  -webkit-backdrop-filter:blur(var(--blur-floating));
  transition:background var(--duration-fast) var(--ease),transform var(--duration-fast) var(--ease);
  flex-shrink:0;
}
.icon-btn:hover{background:var(--glass-strong);transform:scale(1.05)}
.icon-btn:active{transform:scale(.95)}

/* Buttons - Primary tier with gradient */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:14px 28px;
  border-radius:var(--radius-control);
  font-size:.95rem;font-weight:700;letter-spacing:.01em;
  transition:transform var(--duration-fast) var(--ease),box-shadow var(--duration-fast) var(--ease),opacity var(--duration-fast);
  border:1px solid var(--glass-border);
  position:relative;overflow:hidden;
}
.btn::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.25),transparent 50%);
}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* Primary Button - Violet gradient */
.btn-primary{
  background:linear-gradient(135deg,var(--accent-violet),var(--accent-violet-light));
  color:#fff;
  box-shadow:var(--shadow-control);
}
.btn-primary:hover{box-shadow:0 16px 32px rgba(103,66,245,.30)}

/* Secondary Button - Cyan gradient */
.btn-secondary{
  background:linear-gradient(135deg,var(--accent-teal),var(--accent-cyan));
  color:#fff;
  box-shadow:0 12px 26px rgba(13,148,136,.20);
}
.btn-secondary:hover{box-shadow:0 16px 32px rgba(13,148,136,.28)}

/* Ghost Button - Secondary tier */
.btn-ghost{
  background:var(--glass-white);
  color:var(--text-primary);
  backdrop-filter:blur(var(--blur-floating));
  -webkit-backdrop-filter:blur(var(--blur-floating));
}
.btn-ghost:hover{background:var(--glass-strong)}

.btn-sm{padding:10px 20px;font-size:.85rem}
.btn-lg{padding:18px 36px;font-size:1.05rem}
.btn-icon{width:44px;height:44px;padding:0;border-radius:var(--radius-icon)}

/* Input - Floating tier */
.input-wrap{
  position:relative;
  display:flex;
  align-items:center;
  background:var(--glass-white);
  backdrop-filter:blur(var(--blur-floating));
  -webkit-backdrop-filter:blur(var(--blur-floating));
  border:1px solid var(--glass-border);
  border-radius:var(--radius-control);
  padding:0 18px;gap:10px;
  transition:border-color var(--duration-fast) var(--ease),box-shadow var(--duration-fast) var(--ease);
}
.input-wrap:focus-within{
  border-color:var(--accent-violet);
  box-shadow:0 0 0 3px rgba(103,66,245,.15);
}
.input-wrap input{
  flex:1;padding:14px 0;background:none;border:none;outline:none;
  font-size:1rem;color:var(--text-primary);min-width:0;
}
.input-wrap input::placeholder{color:var(--text-secondary);opacity:.7}
.input-wrap .lead-icon{color:var(--text-secondary);font-size:1rem;flex-shrink:0}
.input-wrap .trail-icon{
  width:32px;height:32px;border-radius:var(--radius-icon);
  display:flex;align-items:center;justify-content:center;
  background:var(--accent-violet);color:#fff;font-size:.9rem;flex-shrink:0;
}

/* Toggle Switch */
.toggle{
  width:48px;height:28px;border-radius:var(--radius-control);
  background:rgba(255,255,255,.3);position:relative;
  transition:background .25s var(--ease);flex-shrink:0;
  border:1px solid var(--glass-border);
}
.toggle::after{
  content:"";
  position:absolute;top:3px;left:3px;width:20px;height:20px;
  border-radius:50%;background:#fff;
  transition:transform .25s var(--ease);
  box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.toggle.on{background:var(--accent-green)}
.toggle.on::after{transform:translateX(20px)}

/* Chips / Tags - Secondary tier */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  padding:8px 18px;border-radius:var(--radius-control);
  font-size:.82rem;font-weight:600;
  border:1px solid var(--glass-border);color:var(--text-secondary);
  background:var(--glass-white);
  backdrop-filter:blur(var(--blur-floating));
  -webkit-backdrop-filter:blur(var(--blur-floating));
  transition:all var(--duration-fast) var(--ease);
}
.chip:hover{background:var(--glass-strong)}
.chip.on{
  background:var(--accent-violet);
  border-color:var(--accent-violet);
  color:#fff;
  box-shadow:0 4px 12px rgba(103,66,245,.25);
}

/* Segmented Control - Secondary tier */
.segmented{
  display:inline-flex;
  background:var(--glass-white);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-control);
  padding:4px;gap:2px;
  backdrop-filter:blur(var(--blur-floating));
  -webkit-backdrop-filter:blur(var(--blur-floating));
}
.segmented button{
  padding:8px 20px;border-radius:var(--radius-control);
  font-size:.85rem;font-weight:600;color:var(--text-secondary);
  transition:all var(--duration-fast) var(--ease);
}
.segmented button.on{
  background:var(--accent-violet);
  color:#fff;
  box-shadow:0 2px 8px rgba(103,66,245,.3);
}

/* Greeting */
.greeting{margin:8px 0 4px}
.greeting .small{font-size:.82rem;color:var(--text-secondary)}
.greeting h2{
  font-family:var(--font-serif);font-size:1.8rem;font-weight:700;
  color:var(--text-primary);letter-spacing:-.01em;
}

/* Quote */
.quote{
  margin:16px 0 22px;
  padding:18px 20px;
  font-family:var(--font-serif);
  font-style:italic;
  font-size:.95rem;color:var(--text-primary);
  line-height:1.6;
}

/* Section Label */
.section-label{
  display:flex;justify-content:space-between;align-items:baseline;
  font-size:.78rem;font-weight:600;color:var(--text-secondary);
  letter-spacing:.08em;text-transform:uppercase;
  margin:24px 0 12px;
}

/* Progress Card - Primary tier */
.progress-card{
  padding:24px;
  display:flex;
  align-items:center;
  gap:22px;
}
.ring{position:relative;width:100px;height:100px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .track{fill:none;stroke:rgba(255,255,255,.3);stroke-width:8}
.ring .arc{
  fill:none;stroke:var(--accent-green);stroke-width:8;stroke-linecap:round;
  transition:stroke-dashoffset .5s var(--ease);
}
.ring .ring-text{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}
.ring .ring-text .num{font-size:1.3rem;font-weight:800;color:var(--text-primary)}
.ring .ring-text .lbl{font-size:.62rem;color:var(--text-secondary);letter-spacing:.06em;text-transform:uppercase}
.progress-info{flex:1;min-width:0}
.progress-info .big{font-size:1.6rem;font-weight:800;color:var(--text-primary)}
.legend{display:flex;gap:16px;margin-top:10px;font-size:.78rem;color:var(--text-secondary);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.g{background:var(--accent-green)}
.dot.r{background:#C4705F}
.dot.b{background:var(--bg-lavender)}

/* CTA Button - Primary tier */
.cta{
  width:100%;
  padding:18px;
  border-radius:var(--radius-control);
  font-size:1.05rem;font-weight:700;letter-spacing:.01em;margin-top:22px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(135deg,var(--accent-violet),var(--accent-violet-light));
  color:#fff;
  box-shadow:var(--shadow-control);
  transition:transform var(--duration-fast) var(--ease),box-shadow var(--duration-fast) var(--ease);
  border:1px solid var(--glass-border);position:relative;overflow:hidden;
}
.cta::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.25),transparent 50%);
}
.cta:hover{transform:translateY(-1px);box-shadow:0 16px 32px rgba(103,66,245,.30)}
.cta:active{transform:scale(.97)}

/* Quick Nav - Secondary tier */
.quick-nav{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:24px}
.quick-item{
  padding:16px 8px;text-align:center;display:flex;flex-direction:column;
  align-items:center;gap:8px;font-size:.72rem;font-weight:600;color:var(--text-primary);
  transition:transform var(--duration-fast) var(--ease);
}
.quick-item:hover{transform:translateY(-2px)}
.quick-item .qi{font-size:1.4rem}

/* Recent Card - Secondary tier */
.recent-card{
  padding:18px 20px;display:flex;align-items:center;gap:16px;width:100%;text-align:left;
  transition:transform var(--duration-fast) var(--ease);
}
.recent-card:hover{transform:translateX(4px)}
.recent-badge{
  width:44px;height:44px;border-radius:12px;
  background:rgba(72,185,130,.18);
  display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;
}
.recent-meta{flex:1;min-width:0}
.recent-meta .t{font-weight:700;font-size:.95rem;color:var(--text-primary)}
.recent-meta .s{font-size:.78rem;color:var(--text-secondary);margin-top:2px}
.chev{color:var(--text-secondary);font-size:1.15rem;flex-shrink:0}

/* Featured Card - Primary tier with gradient */
.featured{
  overflow:hidden;
  margin-bottom:20px;
  position:relative;
  padding:24px;display:flex;align-items:center;gap:18px;
  background:linear-gradient(135deg,rgba(243,166,201,.25),rgba(169,168,195,.25),rgba(93,226,225,.25));
}
.featured .thumb{
  width:68px;height:68px;border-radius:16px;
  background:rgba(255,255,255,.35);
  display:flex;align-items:center;justify-content:center;font-size:1.8rem;flex-shrink:0;
}
.featured .ft{flex:1;min-width:0}
.featured .ft .n{font-weight:800;font-size:1.1rem;color:var(--text-primary)}
.featured .ft .d{font-size:.8rem;color:var(--text-secondary);margin-top:4px}
.featured .go{font-size:1.4rem;color:var(--text-primary);opacity:.6;flex-shrink:0}

/* Deck Row - Secondary tier */
.deck-row{
  padding:16px 18px;margin-bottom:12px;display:flex;align-items:center;gap:16px;
  transition:transform var(--duration-fast) var(--ease);width:100%;text-align:left;
}
.deck-row:hover{transform:translateX(4px)}
.deck-row .dnum{
  width:42px;height:42px;border-radius:12px;
  background:rgba(255,255,255,.4);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;color:var(--accent-violet);font-size:.88rem;flex-shrink:0;
  font-family:var(--font-serif);
}
.deck-row .dinfo{flex:1;min-width:0}
.deck-row .dinfo .n{font-weight:700;font-size:.95rem;color:var(--text-primary)}
.deck-row .dinfo .c{font-size:.75rem;color:var(--text-secondary);margin-top:2px}
.mini-ring{width:36px;height:36px;flex-shrink:0}
.mini-ring svg{transform:rotate(-90deg)}
.mini-ring .track{fill:none;stroke:rgba(255,255,255,.3);stroke-width:4}
.mini-ring .arc{fill:none;stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .4s var(--ease)}

/* Study Head - Primary tier */
.study-head{
  margin:0 -16px 22px;padding:18px 22px 24px;
  background:var(--glass-white);
  border-bottom:1px solid var(--glass-border);
  backdrop-filter:blur(var(--blur-primary)) saturate(1.35);
  -webkit-backdrop-filter:blur(var(--blur-primary)) saturate(1.35);
}
.study-head .row{display:flex;align-items:center;justify-content:space-between}
.study-head .t{font-weight:700;font-size:.98rem;color:var(--text-primary)}
.study-head .c{font-size:.78rem;color:var(--text-secondary);margin-top:2px}
.study-bar{height:4px;background:rgba(255,255,255,.25);border-radius:2px;margin-top:16px;overflow:hidden}
.study-bar .f{height:100%;background:var(--accent-violet);border-radius:2px;transition:width .3s var(--ease)}

/* Flash Card - Primary tier (strong) */
.flash-card{
  padding:36px 24px 30px;text-align:center;
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  min-height:300px;animation:cardIn .4s var(--ease);
}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.flash-card .star{
  position:absolute;top:18px;right:20px;font-size:1.2rem;color:var(--text-secondary);
  transition:color var(--duration-fast),transform var(--duration-fast) var(--ease);
  width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
}
.flash-card .star.on{color:var(--accent-pink);transform:scale(1.15)}
.flash-card .kanji{
  font-size:2.8rem;font-weight:800;color:var(--text-primary);line-height:1.3;
  word-break:break-word;animation:kanjiIn .45s var(--ease);
}
@keyframes kanjiIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.flash-card .reading{font-size:1.15rem;color:var(--text-secondary);min-height:1.6em}
.flash-card .hint{font-size:.78rem;color:var(--text-secondary);margin-top:4px}
.flash-card .arti{
  font-size:1.08rem;color:var(--accent-green);font-weight:600;margin-top:10px;
  padding:12px 20px;background:rgba(72,185,130,.15);border-radius:14px;display:none;
}
.flash-card .arti.show{display:block;animation:fadeIn .3s var(--ease)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.answer-row{display:flex;gap:12px;width:100%;margin-top:20px}
.answer-row input{
  flex:1;padding:16px 18px;border-radius:14px;border:1px solid var(--glass-border);
  font-size:1.15rem;text-align:center;background:rgba(255,255,255,.15);outline:none;
  color:var(--text-primary);min-width:0;
  backdrop-filter:blur(var(--blur-floating));
  -webkit-backdrop-filter:blur(var(--blur-floating));
  transition:border-color var(--duration-fast) var(--ease),box-shadow var(--duration-fast) var(--ease);
}
.answer-row input::placeholder{color:var(--text-secondary);opacity:.55}
.answer-row input:focus{border-color:var(--accent-violet);box-shadow:0 0 0 3px rgba(103,66,245,.15)}
.answer-row input.ok{border-color:var(--accent-green);background:rgba(72,185,130,.15);color:var(--accent-green)}
.answer-row input.no{border-color:#C4705F;background:rgba(196,112,95,.12);color:#C4705F}
.answer-row button{
  padding:16px 24px;border-radius:16px;
  background:linear-gradient(135deg,var(--accent-violet),var(--accent-violet-light));
  color:#fff;font-weight:700;font-size:.98rem;flex-shrink:0;

// ---------- Ambient Lighting Animation ----------
let ambientFrameId = null;

function initAmbient(){
  const lights=document.querySelectorAll('.ambient .light');
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduced)return;
  
  const positions=[
    {x:5,y:8},    // warm light starting position
    {x:55,y:30},  // violet light starting position  
    {x:50,y:85}   // cyan light starting position
  ];
  
  function animate(timestamp){
    if(!ambientStartTime) ambientStartTime = timestamp;
    const time = (timestamp - ambientStartTime) / 1000;
    
    lights.forEach((el,i)=>{
      const p=positions[i];
      // Smooth, continuous movement with gentle sine/cosine waves

      el.style.transform = `translate(${p.x + ox}vw, ${p.y + oy}vh)`;

    ambientFrameId = requestAnimationFrame(animate);
  }

}

// ---------- API ----------
async function loadCards(){
  const data = EMBEDDED_CARDS;
  cards = data.cards;
  decks=[];
  for(let i=0;i<cards.length;i+=DECK_SIZE){
    decks.push({
      name:'Bab '+(decks.length+1),
      cards:cards.slice(i,i+DECK_SIZE)
    });
  }
}

// ---------- Router ----------
function go(v){
  view=v;
  render();
  window.scrollTo(0,0);
}

function render(){
  const app=document.getElementById('app');
  if(view==='home')app.innerHTML=viewHome();
  else if(view==='decks')app.innerHTML=viewDecks();
  else if(view==='study')app.innerHTML=viewStudy();
  else if(view==='stats')app.innerHTML=viewStats();
  else if(view==='settings')app.innerHTML=viewSettings();
  afterRender();
}

// ---------- Home View ----------
function ringSVG(pct,size){
  const r=(size-8)/2, c=2*Math.PI*r;
  const off=c-(pct/100)*c;
  const color=pct>=80?'var(--accent-green)':pct>=50?'#D9A441':'var(--bg-lavender)';
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle class="track" cx="${size/2}" cy="${size/2}" r="${r}"/>
    <circle class="arc" cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}"
      stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
  </svg>`;
}

function viewDecks(){
  const rows=decks.map((d,i)=>{
    const st=state.decks[i]||{seen:0,correct:0};
    const pct=d.cards.length?Math.round(st.seen/d.cards.length*100):0;
    const r=14,c=2*Math.PI*r,off=c-(pct/100)*c;

}

// ---------- Study View ----------
function startStudy(deckIdx){
  const i=deckIdx??0;
  study={
    deckIdx:i,
    order:shuffle(decks[i].cards.map((_,j)=>j)),
    pos:0,
    answered:false,
    correct:0,
    wrong:0,
    favs:study.favs
  };
  go('study');
}

function norm(s){
  return (s||'').trim().toLowerCase()
    .replace(/[！-～]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0))
    .replace(/\s+/g,'');
}

function viewStudy(){
  if(!decks.length)return '<div class="empty-note">Memuat kartu...</div>';
  const d=decks[study.deckIdx];
  const card=d.cards[study.order[study.pos]];
  const total=d.cards.length;
  const pct=Math.round((study.pos)/total*100);
  const isFav=study.favs.has(card.kanji);
  return `
  <div class="study-head">
    <div class="row">
      <button class="icon-btn glass-floating" onclick="go('decks')" aria-label="Tutup">✕</button>
      <div style="text-align:center"><div class="t">${d.name}</div><div class="c">${study.pos+1} / ${total}</div></div>
      <button class="icon-btn glass-floating" onclick="toggleFav('${esc(card.kanji).replace(/'/g,"\\'")}')">${isFav?'⭐':'☆'}</button>
    </div>
    <div class="study-bar"><div class="f" style="width:${pct}%"></div></div>
  </div>
  <div class="flash-card glass-primary glass-strong">
    <button class="star ${isFav?'on':''}" onclick="toggleFav('${esc(card.kanji).replace(/'/g,"\\'")}')">★</button>
    <div class="kanji" style="${state.settings.font==='mincho'?'font-family:var(--font-serif)':''}">${esc(card.kanji)}</div>
    <div class="reading" id="reading">${state.settings.showReading?esc(card.hiragana):''}</div>
    <div class="hint">${state.settings.showReading?'':'Ketik bacaan hiragana di bawah'}</div>
    <div class="arti" id="arti">${esc(card.arti)}</div>
  </div>
  <div class="answer-row">
    <input id="ans" placeholder="がっこう" autocomplete="off" autocapitalize="none" ${study.answered?'disabled':''}
      onkeydown="if(event.key==='Enter')checkAnswer()">
    <button id="checkBtn" onclick="checkAnswer()" ${study.answered?'disabled':''}>Cek</button>
  </div>
  <div class="feedback" id="fb"></div>
  <div class="study-nav">
    <button onclick="studyPrev()">← Mundur</button>
    <button onclick="studyNext()">${study.answered?'Lanjut King →':'Lanjut King'}</button>
  </div>`;
}

function afterRender(){
  if(view==='study'){
    const inp=document.getElementById('ans');
    if(inp&&!study.answered)inp.focus();
  }
}

function toggleFav(k){
  if(study.favs.has(k)) study.favs.delete(k);
  else study.favs.add(k);
  saveState();render();
}

function checkAnswer(){
  if(study.answered)return;
  const inp=document.getElementById('ans');
  const btn=document.getElementById('checkBtn');
  const fb=document.getElementById('fb');
  const arti=document.getElementById('arti');
  const val=norm(inp.value);
  const ans=norm(decks[study.deckIdx].cards[study.order[study.pos]].hiragana);
  if(!val)return;
  
  study.answered=true;
  inp.disabled=true;btn.disabled=true;
  const ok=val===ans;
  inp.classList.add(ok?'ok':'no');
  arti.classList.add('show');
  fb.className='feedback show '+(ok?'ok':'no');
  fb.textContent=ok?'✅ Benar!':'❌ Salah — jawaban: '+decks[study.deckIdx].cards[study.order[study.pos]].hiragana;
  if(ok)study.correct++;else study.wrong++;
  bumpDay(ok);
  bumpDeck(study.deckIdx,ok);
  saveState();
}

function studyNext(){
  const total=decks[study.deckIdx].cards.length;
  if(study.pos<total-1){
    study.pos++;
    study.answered=false;
    render();
  }
  else go('stats');
}

function studyPrev(){
  if(study.pos>0){
    study.pos--;
    study.answered=false;
    render();
  }
}

// ---------- Stats View ----------
function viewStats(){
  let tot=0,cor=0,wro=0;
  Object.values(state.days).forEach(d=>{
    tot+=d.studied;cor+=d.correct;wro+=d.wrong;
  });
  const acc=tot?Math.round(cor/tot*100):0;
  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    days.push({
      k:k,
      label:d.toLocaleDateString('id-ID',{day:'numeric',month:'numeric'}),
      n:(state.days[k]||{}).studied||0
    });
  }
  const max=Math.max(1,...days.map(d=>d.n));
  return `
  <div class="topbar">
    <button class="icon-btn glass-floating" onclick="go('home')" aria-label="Kembali">←</button>
    <div class="title">Statistik<small>7 hari terakhir</small></div>
    <span class="range-pill glass-secondary">7 hari</span>
  </div>
  <div class="stat-grid">
    <div class="stat-card glass-secondary"><div class="ic b">📖</div><div class="v">${tot}</div><div class="l">Kartu Dipelajari</div></div>
    <div class="stat-card glass-secondary"><div class="ic g">✅</div><div class="v">${cor}</div><div class="l">Jawaban Benar</div></div>
    <div class="stat-card glass-secondary"><div class="ic r">✕</div><div class="v">${wro}</div><div class="l">Jawaban Salah</div></div>
    <div class="stat-card glass-secondary"><div class="ic y">🎯</div><div class="v">${tot?acc+'%':'—'}</div><div class="l">Akurasi</div></div>
  </div>
  <div class="chart-card glass-secondary">
    <div class="ct">Aktivitas Belajar</div>
    <div class="bars">
      ${days.map(d=>`<div class="bar-col"><div class="bar ${d.n>0?'has':''}" style="height:${Math.max(4,Math.round(d.n/max*92))}px" title="${d.n} kartu"></div><div class="bar-lab">${d.label}</div></div>`).join('')}
    </div>
  </div>
  ${tot===0?'<div class="empty-note">Belum ada aktivitas belajar.<br>Mulai sesi pertamamu dari halaman utama 🌱</div>':''}`;
}

    <button class="icon-btn glass-floating" onclick="go('home')" aria-label="Kembali">←</button>
    <div class="title">Pengaturan<small>Nothxy v1.0.0</small></div>

  </div>
  <div class="group-label">Tampilan</div>
  <div class="set-group glass-secondary">
    <button class="set-row" onclick="cycleFs()">
      <span class="si">☀️</span>

      <span class="sv">›</span>

    <button class="set-row" onclick="cycleFont()">
      <span class="si">あ</span>

      <span class="sv">›</span>
    </button>
  </div>
  <div class="group-label">Belajar</div>

    <div class="set-row">
      <span class="si">🔤</span>
      <div class="sl"><div class="n">Tampilkan Hiragana</div><div class="v">Petunjuk bacaan di kartu</div></div>
      <button class="toggle ${s.showReading?'on':''}" onclick="toggleSetting('showReading')" aria-label="Toggle hiragana"></button>
    </div>
    <div class="set-row">

  <div class="footer-note"><span class="fname">Nothxy</span><br>日本語の語彙 • v1.0.0<br>✨ Dibuat dengan semangat belajar.</div>`;
}

function cycleFs(){
  const order=['S','M','L'];
  const cur=order.indexOf(state.settings.fs);
  state.settings.fs=order[(cur+1)%order.length];
  saveState();render();
}

function cycleFont(){
  state.settings.font=state.settings.font==='gothic'?'mincho':'gothic';
  saveState();render();
}

function toggleSetting(k){
  state.settings[k]=!state.settings[k];
  saveState();render();
}

// ---------- Splash / Video Gate ----------
let audioStarted=false;
function showSplash(){
  const app=document.getElementById('app');
  app.innerHTML=`
  <div class="splash-overlay" id="splashOverlay">
    <div class="splash-content glass glass-strong">
      <div class="splash-logo">🎴</div>
      <h1 class="splash-title">Nothxy</h1>
      <p class="splash-sub">Kosakata Jepang</p>
      <div class="splash-divider"></div>
      <p class="splash-tag">日本語の語彙</p>
      <p class="splash-desc">Belajar kosakata Jepang dengan cara yang lebih sederhana dan nyaman.</p>
      <button class="splash-cta" onclick="startExperience()">Mulai Belajar →</button>
      <p class="splash-note">🎬 Video background akan diputar otomatis</p>
    </div>
  </div>`;
}
function startExperience(){
  if(audioStarted)return;
  audioStarted=true;
  const splash=document.getElementById('splashOverlay');
  if(splash){
    splash.style.opacity='0';
    splash.style.transition='opacity .5s var(--ease)';
    setTimeout(()=>splash.remove(),500);
  }
  startVideo();
  document.body.classList.remove('locked');
  render();
}
let videoFadeTimer=null;
function startVideo(){
  const video=document.getElementById('bgVideo');
  const overlay=document.getElementById('fadeOverlay');
  if(!video)return;
  video.currentTime=0;
  if(videoFadeTimer){clearInterval(videoFadeTimer);videoFadeTimer=null;}
  // Ensure overlay is visible first (start white)
  if(overlay){
    overlay.style.display='block';
    overlay.style.transition='none';
    overlay.style.opacity='1';
  }
  const beginPlayback=()=>{
    video.play().then(()=>{
      // Fade out white overlay to reveal video
      setTimeout(()=>{
        if(overlay){
          overlay.style.transition='opacity 1.5s ease';
          overlay.style.opacity='0';
        }
      },100);
      // Monitor for loop: fade to white near end, fade back in on restart
      videoFadeTimer=setInterval(()=>{
        if(!video||video.paused){clearInterval(videoFadeTimer);videoFadeTimer=null;return;}
        const dur=video.duration;
        if(!isFinite(dur)||dur<=0)return;
        const remaining=dur-video.currentTime;
        if(remaining<1.5&&remaining>0){
          // Fade to white
          if(overlay){
            overlay.style.display='block';
            overlay.style.transition='opacity 1.5s ease';
            overlay.style.opacity='1';
          }
        }else if(remaining>2&&overlay&&overlay.style.opacity==='1'){
          // Video restarted (looped), fade white out
          overlay.style.transition='opacity 1.5s ease';
          overlay.style.opacity='0';
        }
      },200);
    }).catch(()=>{
      if(overlay)overlay.style.display='none';
    });
  };
  if(video.readyState>=2){
    beginPlayback();
  }else{
    video.addEventListener('loadedmetadata',beginPlayback,{once:true});
    video.load();
  }
}
document.body.classList.add('locked');
document.addEventListener('click',function unlockVideo(){
  if(!audioStarted&&view==='splash')startExperience();
},{once:true});

// ---------- Boot ----------
(async function(){
  try{
    await loadCards();
    initAmbient();
    showSplash();
  }catch(e){
    document.getElementById('app').innerHTML=
      '<div class="empty-note">Gagal memuat kartu:<br>'+esc(e.message)+'</div>';
  }
})();
</script>
